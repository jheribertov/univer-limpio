<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portal principal de UniverPass">
  <title>UniverPass | Inicio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="encabezado">
    <a class="marca" href="index.html" aria-label="Ir al inicio">
      <img src="UniverPass.png" alt="Logo de UniverPass" class="logo-imagen" onerror="this.hidden=true">
